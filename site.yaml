  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Antes de venir
    preguntas:
      - { pregunta: "¿Con cuánta antelación encargo una tarta?", respuesta: "Con 48 horas basta para las tartas de la carta. Si quieres foto, nombre o una forma especial, mejor con una semana." }
      - { pregunta: "¿Tenéis pan sin gluten?", respuesta: "Lo hacemos por encargo, con 24 horas de antelación. Ojo: en el obrador se trabaja con harina de trigo, así que si eres celíaco pregúntanos antes." }
      - { pregunta: "¿Me guardáis el pan si llego tarde?", respuesta: "Claro. Llámanos o escríbenos por WhatsApp y te lo dejamos apartado con tu nombre hasta el cierre." }
      - { pregunta: "¿Servís a bares y tiendas?", respuesta: "Sí, repartimos cada mañana en Medina y los pueblos de alrededor. Escríbenos y te contamos cómo trabajamos." }
      - { pregunta: "¿Se puede pagar con tarjeta?", respuesta: "Sí, con tarjeta y con el móvil, también en los encargos." }

