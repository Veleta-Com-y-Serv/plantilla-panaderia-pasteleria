  obrador:
    activa: true
    antetitulo: El obrador
    titulo: Tres generaciones en el mismo horno
    desde: "1962"
    declaracion: "Harina de la comarca, masa madre de la casa y las horas de reposo que pide cada pan."
    texto: |
      Julián Arribas encendió este horno de leña en la calle Padilla en 1962. Hoy lo llevan sus nietos: Laura en la pastelería y Diego en el pan.

      Seguimos amasando de madrugada y cociendo con leña de encina. La masa madre es la misma que empezó el abuelo, alimentada cada día.

      Si algo nos sale distinto un día, es porque se hace a mano. Y eso, en Medina, se nota.
    imagen: /fotos/obrador.jpg
    items:
