  tartas:
    activa: true
    antetitulo: Por encargo
    titulo: Tartas para cada celebración
    texto: "Cumpleaños, bautizos, comuniones o una merienda en casa. Dinos para cuántos y te la tenemos lista."
    tartas:
      - nombre: Tarta de San Marcos
        texto: "Bizcocho, nata y yema tostada al fuego."
        raciones: "8 a 12 raciones"
        precio: "24,00 €"
        imagen: /fotos/tarta-san-marcos.jpg
        imagenes: "/fotos/galeria-2.jpg"
        detalle: |
          La tarta de San Marcos es la más pedida en el obrador y la que más cumpleaños ha visto pasar. Lleva dos capas de bizcocho tierno, nata montada en el momento y una capa de yema que tostamos al fuego, con su punto de caramelo por encima.

          La hacemos el mismo día de la entrega, para que la nata esté fresca y la yema conserve su brillo. Si la quieres con un mensaje, te lo escribimos con chocolate sobre la yema.

          Para conservarla, guárdala en la nevera y sácala un rato antes de servirla. Se corta mejor con un cuchillo pasado por agua caliente.

          Encárgala con dos días de antelación por teléfono o por WhatsApp. Si es para un grupo grande, pregúntanos y te preparamos varias del mismo tamaño o una bandeja rectangular.
      - nombre: Tarta de chocolate y avellana
        texto: "Bizcocho de cacao, crema de avellana y cobertura de chocolate negro."
        raciones: "10 a 14 raciones"
        precio: "28,00 €"
        imagen: /fotos/tarta-chocolate.jpg
        detalle: |
          Para los que no perdonan el chocolate. El bizcocho es de cacao y va empapado en un almíbar suave; entre capa y capa, una crema de avellanas tostadas en el obrador, y por fuera, una cobertura de chocolate negro que cruje al cortar.

          Es la tarta que más nos piden para los cumpleaños de los chavales y la que mejor aguanta un viaje en coche hasta el pueblo.

          Podemos hacerla sin avellana si hay alergia a los frutos secos: avísanos al encargarla y la preparamos aparte, con una crema de chocolate con leche.

          Encárgala con dos días de antelación. Si quieres velas, número o un mensaje encima, dínoslo y te la entregamos lista para la mesa.
      - nombre: Tarta de queso al horno
        texto: "Cremosa por dentro y tostada por fuera, sin base de galleta."
        raciones: "8 a 10 raciones"
        precio: "26,00 €"
        imagen: /fotos/tarta-queso.jpg
        detalle: |
          Una tarta de queso al estilo de las de horno alto: sin base, con la superficie bien tostada y el centro cremoso, casi líquido si la comes templada.

          Usamos queso fresco de vaca, nata, huevos y muy poco azúcar. Nada más. Sale del horno temblando y la dejamos reposar unas horas para que asiente.

          Si la prefieres más cuajada, dínoslo y la dejamos unos minutos más en el horno. Acompaña bien con unos frutos rojos o con un poco de mermelada de la casa.

          Encárgala con dos días de antelación y recógela en el horno. Si la guardas en la nevera, sácala media hora antes de comerla para que recupere la textura.
    items:
